ignore:
  - reason: uuid@7.0.3 is pulled in transitively via expo -> @expo/config-plugins -> xcode. xcode is only used at build time (generating native iOS project files during `expo prebuild`), not shipped in the app bundle, so this is low risk. Remove once expo updates upstream.
    vulnerability: GHSA-w5hq-g745-h8pq
  - reason: image-size is pulled in transitively via expo -> @expo/metro-config -> metro, used only by Metro (the bundler) at local dev/build time to read image dimensions for asset resolution. Not shipped in the app or exposed to untrusted input. Remove once expo updates upstream.
    vulnerability: GHSA-w3rx-r6r6-pgpr
