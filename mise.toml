[env]
ANDROID_HOME = "{{ xdg_data_home }}/android-sdk"
ANDROID_SDK_ROOT = "{{ xdg_data_home }}/android-sdk"
EXPO_UNSTABLE_MCP_SERVER = 1
HK_MISE = 1
_.path = ["{{ xdg_data_home }}/android-sdk/platform-tools"]

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = ["hk install --mise"]

[settings]
lockfile = true

[settings.github]
use_git_credentials = true

[tasks]
ai-setup = "capa install --yes"
check = ["hk check --all", "cog check"]
prepare = ["npm ci"]

[tasks.android-prebuild]
depends = ["android-setup"]
description = "Generate the Android project with Expo"
run = "npx expo prebuild --platform android --no-install"

[tasks.android-setup]
description = "Install the Android SDK packages required by Expo SDK 54"
run = 'android --sdk="{{ env.ANDROID_HOME }}" sdk install platform-tools platforms/android-36 build-tools/36.0.0 ndk/27.1.12297006 cmake/3.22.1'

[tasks.build-android]
depends = ["android-prebuild"]
description = "Build an Android App Bundle locally"
dir = "android"
env = { NODE_ENV = "production" }
run = "./gradlew :app:bundleRelease"
run_windows = '.\gradlew.bat :app:bundleRelease'

[tasks.build-android-apk]
depends = ["android-prebuild"]
description = "Build an Android APK locally"
dir = "android"
env = { NODE_ENV = "production" }
run = "./gradlew :app:assembleRelease"
run_windows = '.\gradlew.bat :app:assembleRelease'

[tasks.build-ios]
run = "npx eas-cli@latest build --platform ios --profile production --local"

[tasks.format]
alias = "fmt"
run = [{ task = "treefmt" }, "hk fix --all"]

[tasks.ios-device]
description = "Build a Release app and install it on a connected iPhone"
# Uses xcodebuild + devicectl directly: `expo run:ios` needs Simulator.app even
# for physical devices, and newer Xcode releases no longer bundle it.
run = '''
xcodebuild -workspace ios/PocketDraw.xcworkspace -scheme PocketDraw \
  -configuration Release -destination "id=${usage_udid}" \
  -derivedDataPath ios/build -allowProvisioningUpdates build
xcrun devicectl device install app --device "${usage_udid}" \
  ios/build/Build/Products/Release-iphoneos/PocketDraw.app
'''
usage = 'arg "<udid>" help="iPhone UDID from: xcrun devicectl list devices"'

[tasks.ios-prebuild]
depends_post = ["ios-signing"]
description = "Generate the iOS project with Expo (append --clean to regenerate it)"
run = "npx expo prebuild --platform ios --no-install"

[tasks.ios-signing]
description = "Apply local iOS signing overrides (IOS_DEVELOPMENT_TEAM, IOS_BUNDLE_IDENTIFIER, IOS_PERSONAL_TEAM) from mise.local.toml"
run = '''
pbxproj=$(ls ios/*.xcodeproj/project.pbxproj)
if [ -n "${IOS_DEVELOPMENT_TEAM:-}" ]; then
  sed -i '' -E "s/DEVELOPMENT_TEAM = [^;]+;/DEVELOPMENT_TEAM = ${IOS_DEVELOPMENT_TEAM};/" "$pbxproj"
fi
if [ -n "${IOS_BUNDLE_IDENTIFIER:-}" ]; then
  sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = \"?com\.pix-l-crafters\.pocketdraw\"?;/PRODUCT_BUNDLE_IDENTIFIER = \"${IOS_BUNDLE_IDENTIFIER}\";/" "$pbxproj"
fi
# Free personal teams cannot sign the hotspot entitlements the duel uses.
if [ "${IOS_PERSONAL_TEAM:-}" = "1" ]; then
  for key in com.apple.developer.networking.HotspotConfiguration com.apple.developer.networking.wifi-info; do
    /usr/libexec/PlistBuddy -c "Delete :${key}" ios/PocketDraw/PocketDraw.entitlements 2>/dev/null || true
  done
fi
grep -E "DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER" "$pbxproj" | sort -u
'''

[tasks.local-prepare]
run = ["npm ci", "gh auth login", { task = "ai-setup" }]

[tasks.test-hotspot-ip]
description = "Check native hotspot IPv4 selection without an Android device"
run = '''
set -eu
build_dir="$(mktemp -d)"
trap 'rm -rf "$build_dir"' EXIT
mise exec kotlin@2.1.20 -- kotlinc \
  modules/local-only-hotspot/android/src/main/java/expo/modules/localonlyhotspot/HotspotIpv4.kt \
  modules/local-only-hotspot/android/src/test/java/expo/modules/localonlyhotspot/HotspotIpv4Test.kt \
  -include-runtime -d "$build_dir/check.jar"
java -jar "$build_dir/check.jar"
'''

[tasks.treefmt]
run = "treefmt"
run_windows = "echo 'Treefmt not supported on Windows'"

[tools]
android-cli = { bin = "android", platforms = { linux-x64 = { checksum_url = "https://dl.google.com/android/cli/{{ version }}/linux_x86_64/android.sha256", url = "https://dl.google.com/android/cli/{{ version }}/linux_x86_64/android" }, macos-arm64 = { checksum_url = "https://dl.google.com/android/cli/{{ version }}/darwin_arm64/android.sha256", url = "https://dl.google.com/android/cli/{{ version }}/darwin_arm64/android" }, macos-x64 = { checksum_url = "https://dl.google.com/android/cli/{{ version }}/darwin_x86_64/android.sha256", url = "https://dl.google.com/android/cli/{{ version }}/darwin_x86_64/android" }, windows-arm64 = { bin = "android.exe", checksum_url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe.sha256", url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe" }, windows-x64 = { bin = "android.exe", checksum_url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe.sha256", url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe" } }, version = "latest", version_list_url = "https://dl.google.com/android/cli/latest/debian/dists/stable/main/binary-amd64/Packages", version_regex = '(?m)^Version: (\S+)$' }
android-sdk = "latest"
"aqua:google/keep-sorted" = "latest"
"aqua:numtide/treefmt" = { os = ["linux", "macos"], version = "2.6.0" }
"aqua:owenlamont/ryl" = "latest"
betterleaks = "latest"
cocogitto = "latest"
cspell = "latest"
editorconfig-checker = "latest"
fnox = "latest"
gh = "latest"
git-cliff = "latest"
"github:MRDGH2821/Sort-Markdown-Tables" = "latest"
"github:infragate/capa" = { postinstall = "capa install --yes", version = "2.2.4" }
hk = "2.5.0"
java = "temurin-17"
ls-lint = "latest"
node = "24"
npm = "latest"
oxfmt = "latest"
oxlint = "latest"
"pipx:lorenzwalthert/gitignore-tidy" = "latest"
"pipx:toml-sort" = "latest"
"pipx:yamlfix" = "latest"
pkl = "latest"
ruff = "latest"
rumdl = "latest"
tombi = "latest"
typos = "latest"
typstyle = "latest"
uv = "latest"
yq = "latest"

[[watch_files]]
patterns = ["capabilities.yaml"]
task = "ai-setup"
