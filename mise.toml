[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = ["hk install --mise"]

[tasks]
ai-setup = "apm install"
cspell = "cspell ."
pre-commit = "hk run pre-commit"

[tools]
apm = { postinstall = "apm install", version = "latest" }
"aqua:numtide/treefmt" = "latest"
cocogitto = "latest"
cspell = "latest"
git-cliff = "latest"
hk = "latest"
ls-lint = "latest"
node = "24"
npm = { postinstall = "npm install", version = "latest" }
"npm:sort-package-json" = "latest"
"pipx:yamlfix" = "latest"
pkl = "latest"
prettier = "latest"
rumdl = "latest"
tombi = "latest"
uv = "latest"
yamllint = "latest"
yq = "latest"

[[watch_files]]
patterns = ["apm.yml"]
task = "ai-setup"
