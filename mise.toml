[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = ["hk install --mise"]

[tasks]
ai-setup = "apm install"
check = ["hk check --all"]
cspell = "cspell ."
fmt = ["hk fix --all", "treefmt"]
pre-commit = "hk run pre-commit"
prepare = ["npm install"]

[tools]
android-sdk = "latest"
apm = { postinstall = "apm install", version = "latest" }
"aqua:google/keep-sorted" = "latest"
"aqua:numtide/treefmt" = "latest"
betterleaks = "latest"
cocogitto = "latest"
cspell = "latest"
git-cliff = "latest"
hk = "latest"
ls-lint = "latest"
node = "24"
npm = { postinstall = "npm install", version = "latest" }
"npm:sort-package-json" = "latest"
"pipx:yamlfix" = "latest"
pkl = "latest"
prettier = "latest"
ruff = "latest"
rumdl = "latest"
tombi = "latest"
typos = "latest"
typstyle = "latest"
uv = "latest"
yamllint = "latest"
yq = "latest"

[[watch_files]]
patterns = ["apm.yml"]
task = "ai-setup"
